[project]
name = "ha-mcphub"
version = "1.0.1-dev0"
description = "Home Assistant custom integration for MCPHub Central Gateway & Control Plane."
authors = [
    {name = "FaserF", email = "github@fabiseitz.de"}
]
readme = "README.md"
requires-python = "==3.15.2"
dependencies = [
    "aiohttp==3.13.3",
]

[project.optional-dependencies]
test = [
    "pillow",
    "pytest",
    "pytest-asyncio",
    "pytest-homeassistant-custom-component",
    "pytest-socket",
    "ruff",
    "mypy",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501", "B008", "SIM102", "SIM105", "SIM117", "E402", "B017", "B904", "ARG001", "RUF012", "DTZ003", "DTZ007", "DTZ001", "DTZ005", "BLE001", "S110", "S112"]

[tool.mypy]
explicit_package_bases = true
python_version = "3.12"
show_error_codes = true
follow_imports = "silent"
ignore_missing_imports = true
strict_equality = true
warn_incomplete_stub = true
warn_redundant_casts = true
warn_unused_configs = false
warn_unused_ignores = true
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_subclassing_any = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
disallow_untyped_defs = true
disable_error_code = ["misc", "call-arg", "import-untyped", "union-attr", "typeddict-unknown-key", "arg-type", "return-value"]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
norecursedirs = [
    ".git",
    "testing_config",
]
asyncio_mode = "auto"
